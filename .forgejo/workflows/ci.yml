name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: docker
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
