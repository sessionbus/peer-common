name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GO_VERSION: '1.24.x'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  ACTIONLINT_VERSION: 'v1.7.7'
jobs:
  common:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - name: Build libraries and maintenance utility
        run: |
          go build ./host ./mcp ./peerversion ./testsocket
          go build -o "$RUNNER_TEMP/cleanup-legacy" ./scripts/cleanup-legacy
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          golangci-lint run ./...
  workflow-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - run: actionlint
